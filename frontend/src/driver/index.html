<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Yan.Pro — Водитель</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1A1A">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ═══════════════ ЭКРАН ВХОДА ═══════════════ -->
<div id="authScreen">
  <h1>Yan.Pro</h1>
  <p class="sub">Кабинет водителя / механика</p>
  <div class="authCard">
    <div id="loginForm">
      <div class="field"><label>Логин</label><input id="loginLogin" autocomplete="username"></div>
      <div class="field"><label>Пароль</label><input id="loginPass" type="password" autocomplete="current-password"></div>
      <button class="primaryBtn" id="btnLogin">Войти</button>
      <button class="linkBtn" id="toRegister">Нет аккаунта? Зарегистрироваться</button>
    </div>
    <div id="registerForm" class="hidden">
      <div class="roleToggle">
        <div class="roleOpt active" id="roleDriverOpt">🚕 Водитель</div>
        <div class="roleOpt" id="roleMechanicOpt">🔧 Механик</div>
      </div>
      <div class="field"><label>Имя</label><input id="regName"></div>
      <div class="field"><label>Логин</label><input id="regLogin" autocomplete="username"></div>
      <div class="field"><label>Телефон</label><input id="regPhone" type="tel" placeholder="+7..."></div>
      <div class="field"><label>Пароль (мин. 6 символов)</label><input id="regPass" type="password" autocomplete="new-password"></div>
      <div id="vehicleFields">
        <div class="field"><label>Марка автомобиля</label><input id="regVehicleMake"></div>
        <div class="field"><label>Госномер</label><input id="regVehiclePlate"></div>
      </div>
      <button class="primaryBtn" id="btnRegister">Зарегистрироваться</button>
      <button class="linkBtn" id="toLogin">Уже есть аккаунт? Войти</button>
    </div>
    <div class="authError" id="authError"></div>
  </div>
  <button class="linkBtn" id="btnServerSettings" style="color:#777; margin-top:16px;">⚙ Адрес сервера</button>
</div>

<!-- ═══════════════ КАРТА / ОСНОВНОЕ ПРИЛОЖЕНИЕ ═══════════════ -->
<div id="map"></div>

<div id="topBar" class="hidden">
  <div class="pill" id="onlineSwitch">
    <div class="switchTrack" id="switchTrack"><div class="switchKnob"></div></div>
    <span id="onlineLabel">Оффлайн</span>
  </div>
  <button class="roundBtn" id="btnHistory">📋</button>
  <button class="roundBtn" id="btnSkipped" style="font-size:14px;">⏳</button>
  <div class="pill" id="earningsPill">₽0<span class="count" id="ridesCount"></span></div>
  <button class="roundBtn" id="btnMenu">☰</button>
</div>

<div id="requestCard" class="hidden"></div>
<div id="sheet" class="hidden"></div>
<div id="connBar" class="hidden" style="position:fixed;top:60px;left:12px;right:12px;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;z-index:25;text-align:center;"></div>
<div id="toast"></div>

<!-- ═══════════════ МЕНЮ ═══════════════ -->
<div id="menuOverlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;" onclick="this.classList.add('hidden')"></div>
<div id="menuCard" class="hidden" style="position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px+env(safe-area-inset-bottom));z-index:41;box-shadow:var(--shadow);">
  <div style="width:36px;height:4px;background:#DDD;border-radius:2px;margin:0 auto 14px;"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
    <div style="font-size:16px;font-weight:700;">Меню</div>
    <button id="menuClose" style="width:34px;height:34px;border-radius:50%;border:none;background:#F0F0F0;color:var(--text);font-size:16px;cursor:pointer;line-height:1;">✕</button>
  </div>
  <a id="menuEarnings" href="earnings.html" style="display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #F0F0F0;color:var(--text);text-decoration:none;font-size:15px;font-weight:600;">💰 Доходы и бонусы</a>
  <div id="menuLogout" style="display:flex;align-items:center;gap:12px;padding:14px 0;color:var(--danger);font-size:15px;font-weight:600;cursor:pointer;">🚪 Выйти</div>
</div>

<!-- ═══════════════ МОДАЛКА ЦЕНЫ ═══════════════ -->
<div id="priceOverlay" class="hidden">
  <div id="priceCard">
    <h3>Стоимость поездки</h3>
    <div class="routeInfo" id="priceRouteInfo"></div>
    <input id="priceInput" type="number" inputmode="decimal" placeholder="0" autofocus>
    <div class="priceHint" id="priceHint"></div>
    <div class="priceActions">
      <button class="btnDanger" id="priceCancel" style="background:var(--card2); color:var(--text);">Отмена</button>
      <button class="btnYellow" id="priceConfirm" style="background:var(--yellow); color:#111;">Завершить</button>
    </div>
  </div>
</div>

<!-- ═══════════════ ЧАТ ═══════════════ -->
<div id="chatOverlay" class="hidden">
  <div id="chatHeader">
    <button class="backBtn" id="chatBack">←</button>
    <div class="passInfo"><div class="name" id="chatPeerName">Пассажир</div></div>
  </div>
  <div id="chatMessages"></div>
  <div id="chatInputRow">
    <input id="chatInput" placeholder="Сообщение...">
    <button id="chatSend">➤</button>
  </div>
</div>

<!-- ═══════════════ ИСТОРИЯ ═══════════════ -->
<div id="historyOverlay" class="hidden">
  <div id="historyHeader">
    <button class="backBtn" id="historyBack">←</button>
    <div style="font-weight:700; font-size:16px;">История поездок</div>
  </div>
  <div id="historyList"></div>
</div>

<!-- ═══════════════ ПРОПУЩЕННЫЕ ═══════════════ -->
<div id="skippedOverlay" class="hidden" style="position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;">
  <div style="position:sticky;top:0;background:var(--bg);padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #333;z-index:1;">
    <button class="backBtn" id="skippedBack">←</button>
    <div style="font-weight:700; font-size:16px;">Пропущенные</div>
  </div>
  <div id="skippedList" style="padding:0 16px 24px;"></div>
</div>

<script type="module" src="./index.ts"></script>
</body>
</html>
