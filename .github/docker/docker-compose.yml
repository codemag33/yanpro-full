services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: yanpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: yanpro
    ports:
      # Только локально — наружу не торчим (файрвол на уровне портов)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./../../backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanpro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../../
      dockerfile: .github/docker/Dockerfile
    environment:
      DATABASE_URL: postgres://yanpro:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/yanpro
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 30d
      CORS_ORIGIN: ${CORS_ORIGIN:-https://taxi.fbs3.ru}
      PORT: 3002
    ports:
      - "3002:3002"
    volumes:
      # Папка с APK на хосте — доступна по постоянной ссылке /apk/yanpro-driver.apk.
      # Обновляется скриптом scripts/update-apk.sh (забирает из GitHub Release latest-apk).
      - ../../apk:/app/apk
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
