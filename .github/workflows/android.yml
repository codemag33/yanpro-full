name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'android/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # для обновления GitHub Release latest-apk
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish APK to Release (latest-apk)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/yanpro-driver.apk
          gh release view latest-apk --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create latest-apk --repo "${{ github.repository }}" \
               --title "Latest APK" --notes "Последняя сборка приложения водителя (обновляется автоматически)"
          gh release upload latest-apk /tmp/yanpro-driver.apk \
            --repo "${{ github.repository }}" --clobber
          echo "APK опубликован: https://github.com/${{ github.repository }}/releases/download/latest-apk/yanpro-driver.apk"
